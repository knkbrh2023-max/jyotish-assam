<!DOCTYPE html>
<html lang="as">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আপোনাৰ জ্যোতিষ ৰিপোৰ্ট | জ্যোতিষ অসম</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Assamese:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans Assamese', sans-serif; }
        body { background: #fdf5e6; color: #3e2723; min-height: 100vh; display: flex; flex-direction: column; }
        header { background: #8b0000; color: white; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .brand { font-size: 18px; font-weight: 700; color: #fef08a; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .home-btn { background: rgba(255,255,255,0.15); color: #fdf5e6; padding: 6px 14px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 600; border: 1px solid rgba(255,255,255,0.3); transition: 0.2s; }
        .home-btn:hover { background: rgba(255,255,255,0.3); color: white; }
        
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 25px 15px; }
        .status-card { background: white; border-radius: 16px; padding: 35px 25px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-top: 5px solid #8b0000; }
        .spinner { border: 4px solid rgba(139,0,0,0.15); border-top: 4px solid #8b0000; border-radius: 50%; width: 55px; height: 55px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        h2 { font-size: 21px; color: #8b0000; margin-bottom: 12px; }
        p { font-size: 14.5px; color: #4b5563; line-height: 1.6; margin-bottom: 20px; }
        .btn-action { display: inline-block; background: #8b0000; color: white; padding: 12px 26px; border-radius: 25px; text-decoration: none; font-weight: 700; font-size: 14.5px; box-shadow: 0 4px 10px rgba(139,0,0,0.25); border: none; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: #700000; transform: translateY(-1px); }
        .input-box { width: 100%; padding: 12px 14px; font-size: 15px; border-radius: 8px; border: 1px solid #d4b483; margin-bottom: 12px; box-sizing: border-box; outline: none; }
        .input-box:focus { border-color: #8b0000; box-shadow: 0 0 5px rgba(139,0,0,0.2); }

        /* Customer Support Chat Widget Styles */
        #support-widget-btn {
            position: fixed; bottom: 25px; left: 25px; 
            background: linear-gradient(135deg, #10B981, #047857); color: white;
            padding: 12px 22px; border-radius: 50px; font-size: 15px; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); z-index: 9999;
            transition: transform 0.3s, box-shadow 0.3s; display: flex; align-items: center; gap: 8px; border: 2px solid #a7f3d0;
        }
        #support-widget-btn:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6); }

        #support-chat-window {
            position: fixed; bottom: 85px; left: 25px; width: 320px; max-width: 90vw;
            background: #f8fafc; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            z-index: 10000; display: none; flex-direction: column; overflow: hidden; border: 2px solid #e2e8f0; font-family: inherit;
        }
        .support-header { background: #047857; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .support-body { padding: 15px; }
        .support-msg {
            background: white; padding: 12px; border-radius: 10px; border-top-left-radius: 2px;
            font-size: 13.5px; color: #334155; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-left: 4px solid #10B981; margin-bottom: 15px; line-height: 1.5; text-align: left;
        }
        .sup-input {
            width: 100%; padding: 10px 12px; margin-bottom: 10px; border: 1px solid #cbd5e1;
            border-radius: 8px; font-family: inherit; font-size: 13.5px; outline: none; box-sizing: border-box; background: #fff;
        }
        .sup-input:focus { border-color: #10B981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
        .support-footer { padding: 0 15px 15px 15px; }
        #sup-send-btn {
            width: 100%; background: #10B981; color: white; border: none; padding: 12px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 15px;
        }
        #sup-send-btn:hover { background: #047857; }

        @media print {
            header, main, #statusCard, #support-widget-btn, #support-chat-window, .no-print {
                display: none !important;
                visibility: hidden !important;
            }
        }
    </style>
    <script src="grand_report_engine.js?v=10"></script>
</head>
<body>

    <header>
        <a href="index.html" class="brand">🔮 জ্যোতিষ অসম</a>
        <a href="index.html" class="home-btn">← মূল পৃষ্ঠা</a>
    </header>

    <main>
        <div class="status-card" id="statusCard">
            <div class="spinner" id="spinner"></div>
            <h2 id="statusTitle">✨ আপোনাৰ ৰিপোৰ্ট প্ৰস্তুত হৈ আছে...</h2>
            <div id="orderBadgeWrap"></div>
            <p id="statusMsg">অনুগ্ৰহ কৰি কেইছেকেণ্ডমান অপেক্ষা কৰক।</p>
            <div id="actionArea"></div>
        </div>
    </main>

    <!-- Customer Support Widget -->
    <div id="support-widget-btn" onclick="toggleSupportChat()">
        🎧 সহায় (Support)
    </div>

    <div id="support-chat-window">
        <div class="support-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="font-size: 24px;">👨‍💻</div>
                <div>
                    <strong style="font-size: 14px;">জ্যোতিষ অসম সহায়ক</strong>
                    <div style="font-size: 11px; color: #a7f3d0;">আপোনাৰ সমস্যা আমাক জনাওক</div>
                </div>
            </div>
            <span onclick="toggleSupportChat()" style="cursor: pointer; font-size: 24px; font-weight: bold; line-height: 1;">×</span>
        </div>
        
        <div class="support-body">
            <div class="support-msg">
                নমস্কাৰ! 🙏 পেমেন্ট বা ৰিপোৰ্ট সম্পৰ্কীয় যিকোনো সমস্যা তলত লিখক। আমাৰ টীমে চেক কৰি লগে লগে সমাধান কৰিব।
            </div>
            <input type="text" id="sup-name" aria-label="সহায়ৰ বাবে নাম" class="sup-input" placeholder="আপোনাৰ নাম" required>
            <input type="text" id="sup-contact" aria-label="যোগাযোগৰ ইমেইল" class="sup-input" placeholder="ইমেইল বা ফোন নম্বৰ">
            <textarea id="sup-msg" aria-label="সমস্যাৰ বিৱৰণ" class="sup-input" rows="3" placeholder="সমস্যাৰ বিৱৰণ (Order ID বা Payment ID উল্লেখ কৰিব)" required></textarea>
        </div>
        
        <div class="support-footer">
            <button id="sup-send-btn" onclick="sendSupportMessageToDB()">ছাবমিট কৰক (Submit)</button>
        </div>
    </div>

    <script>
    
// generatePalmistryReportHtml is loaded from grand_report_engine.js


// --- Fallback Vedic Chart Calculation Engine ---
    function buildFallbackVedicChart(dobStr, tobStr, placeStr) {
        if (typeof window.calculateAccurateVedicChart === 'function') {
            return window.calculateAccurateVedicChart(dobStr, tobStr, placeStr);
        }
        return null;
    }

    // --- Complete Rich Vedic Report Generation Function ---
    function renderFullReport(order, chart) {
        if (order && (
            order.service === 'palmistry' || 
            String(order.service).toLowerCase().includes('palm') ||
            order.palmHand || 
            order.palmGender || 
            order.palmPhoto
        )) {
            return generatePalmistryReportHtml(order);
        }
        return generateGrandVedicReport(order, chart);
    }

    // --- Automatic Order Resolution & Lookup Engine ---
    (async function() {
        const urlParams = new URLSearchParams(window.location.search);
        let orderId = urlParams.get('order') || urlParams.get('orderId') || urlParams.get('razorpay_order_id') || localStorage.getItem('ja_latest_order_id');
        const paymentId = urlParams.get('razorpay_payment_id');
        const rzpOrderId = urlParams.get('razorpay_order_id');
        const rzpSignature = urlParams.get('razorpay_signature');

        // ১. যদি ব্ৰাউজাৰৰ স্থানীয় সংৰক্ষণত নতুনকৈ তৈয়াৰী (v8) বৈধ ৰিপোৰ্ট মজুত আছে
        if (orderId) {
            const cached = sessionStorage.getItem('ja_report_v8_' + orderId) || localStorage.getItem('ja_report_v8_' + orderId);
            const savedSvc = (localStorage.getItem('ja_service_' + orderId) || sessionStorage.getItem('ja_service_' + orderId) || '').toLowerCase();
            const isValidMonthly = !(savedSvc === 'monthly' || (cached && cached.includes('মাহেকীয়া ৰাশিফল প্ৰতিবেদন'))) || (cached && cached.includes('মাহটোৰ ৪টা সপ্তাহৰ বিস্তৃত সাপ্তাহিক ফলাফল'));
            const isValidYearly = !(savedSvc === 'yearly' || (cached && cached.includes('বাৰ্ষিক ৰাশিফল প্ৰতিবেদন'))) || (cached && cached.includes('বাৰ্ষিক ১২ মাহৰ বিস্তৃত মাহেকীয়া ফলাফল'));
            const isValidPalm = !(savedSvc === 'palmistry') || (cached && !cached.includes('Complete Grand Birth Chart'));
            if (cached && isValidMonthly && isValidYearly && isValidPalm) {
                try {
                    const sw = document.getElementById('support-widget-btn');
                    if (sw) sw.remove();
                    const sc = document.getElementById('support-chat-window');
                    if (sc) sc.remove();
                    const hd = document.querySelector('header');
                    if (hd) hd.remove();
                    const mn = document.querySelector('main');
                    if (mn) mn.remove();
                } catch(e){}
                document.open();
                document.write(cached);
                document.close();
                return;
            }
        }

        const SUPABASE_URL = "https://ihbdrtnkfitytklonnel.supabase.co";
        const SUPABASE_KEY = "sb_publishable_aM1N898qE1gsw22dyxIoZQ_HTh_Qprj";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let order = null;

        // ২. Supabase-ৰ পৰা অৰ্ডাৰ তথ্য বিচাৰি উলিওৱা
        if (orderId) {
            try {
                const { data } = await sb.from('orders').select('*').or(`public_order_id.eq.${orderId},id.eq.${orderId}`);
                if (data && data.length > 0) {
                    order = data[0];
                }
            } catch(e) {
                console.warn("DB query error:", e);
            }
        }

        // ৩. যদি পোৱা নগ'ল, localStorage-ৰ পেন্ডিং ডাটা চেক কৰা
        if (!order) {
            const pending = localStorage.getItem('ja_pending_order');
            if (pending) {
                try { order = JSON.parse(pending); } catch(e){}
            }
        }

        // ৪. যদি অৰ্ডাৰ পোৱা গ'ল, ৰিপোৰ্ট প্ৰস্তুত কৰা
        if (order) {
            const sKey = order.public_order_id || order.id || orderId;
            const savedSvc = localStorage.getItem('ja_service_' + sKey) || sessionStorage.getItem('ja_service_' + sKey);
            if (savedSvc) order.service = savedSvc;
            if (order.service === 'palmistry') {
                const pPhoto = localStorage.getItem('ja_palm_photo_' + sKey);
                if (pPhoto) order.palmPhoto = pPhoto;
            }

            document.getElementById('statusTitle').innerText = "✨ কুণ্ডলী বিশ্লেষণ সম্পূৰ্ণ হৈছে...";
            document.getElementById('statusMsg').innerText = "ৰিপোৰ্ট প্ৰদৰ্শন কৰা হৈছে। অনুগ্ৰহ কৰি ৰ'ব...";

            // 🔒 সুৰক্ষিত পেমেন্ট ভেৰিফিকেচন: কেৱল বৈধ Razorpay Signature থাকিলেহে verify-payment এজ ফাংচনৰ জৰিয়তে আপডেট হ'ব
            if (paymentId && rzpOrderId && rzpSignature && order.payment_status !== 'paid') {
                try {
                    const apiBase = (window.JA_CONFIG && window.JA_CONFIG.apiBaseUrl) || (SUPABASE_URL + '/functions/v1');
                    await fetch(apiBase + '/verify-payment', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': SUPABASE_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_KEY
                        },
                        body: JSON.stringify({
                            orderId: order.public_order_id || order.id,
                            razorpay_order_id: rzpOrderId,
                            razorpay_payment_id: paymentId,
                            razorpay_signature: rzpSignature
                        })
                    });
                } catch(e) {
                    console.warn("Payment verification call warning:", e);
                }
            }

            // যদি হস্তৰেখা অৰ্ডাৰ হয় আৰু হাতৰ ফটো আছে, তেন্তে AI Vision বিশ্লেষণ চেষ্টা কৰক
            if (order.service === 'palmistry' && order.palmPhoto && !order.aiPalmAnalysis) {
                try {
                    const apiBase = (window.JA_CONFIG && window.JA_CONFIG.apiBaseUrl) || (SUPABASE_URL + '/functions/v1');
                    const aiRes = await fetch(apiBase + '/analyze-palm', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            palmPhoto: order.palmPhoto,
                            palmHand: order.palmHand || order.palm_hand || 'right',
                            palmGender: order.palmGender || order.palm_gender || 'male',
                            name: order.name
                        })
                    });
                    if (aiRes.ok) {
                        const aiJson = await aiRes.json();
                        if (aiJson && aiJson.success && aiJson.analysis) {
                            order.aiPalmAnalysis = aiJson.analysis;
                        }
                    }
                } catch(e) {}
            }

            const dobStr = order.birth_date || order.birthDate || '1996-01-01';
            const tobStr = order.birth_time || order.birthTime || '10:30:00';
            const chart = buildFallbackVedicChart(dobStr, tobStr);
            const reportHtml = renderFullReport(order, chart);

            const saveId = order.public_order_id || order.id || orderId || 'temp';
            try {
                localStorage.setItem('ja_report_v8_' + saveId, reportHtml);
                sessionStorage.setItem('ja_report_v8_' + saveId, reportHtml);
                localStorage.setItem('ja_report_' + saveId, reportHtml);
                sessionStorage.setItem('ja_report_' + saveId, reportHtml);
                localStorage.setItem('ja_latest_order_id', saveId);
            } catch(e){}

            try {
                const sw = document.getElementById('support-widget-btn');
                if (sw) sw.remove();
                const sc = document.getElementById('support-chat-window');
                if (sc) sc.remove();
                const hd = document.querySelector('header');
                if (hd) hd.remove();
                const mn = document.querySelector('main');
                if (mn) mn.remove();
            } catch(e){}
            document.open();
            document.write(reportHtml);
            document.close();
            return;
        }

        // ৫. যদি কোনো অৰ্ডাৰ পোৱা নগ'ল, গ্ৰাহকৰ বাবে সহায়ক চাৰ্ছ ফৰ্ম দেখুৱাওক
        showManualLookupForm();
    })();

    function showManualLookupForm() {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('statusTitle').innerText = "🔍 আপোনাৰ ৰিপোৰ্ট বিচাৰক";
        document.getElementById('statusMsg').innerText = "ফেচবুক বা আন কোনো ব্ৰাউজাৰত পেমেন্ট কৰাৰ পিছত যদি পেজটো বন্ধ হৈ গৈছিল, তলত আপোনাৰ ইমেইল বা অৰ্ডাৰ নম্বৰ দিয়ক:";
        document.getElementById('actionArea').innerHTML = `
            <div style="margin: 15px 0;">
                <input type="text" id="lookupInput" class="input-box" placeholder="ইমেইল (Email) বা অৰ্ডাৰ আইডি দিয়ক" />
                <button onclick="handleManualSearch()" class="btn-action" style="width: 100%;">ৰিপোৰ্ট খোলক (Open Report)</button>
            </div>
            <div id="searchResultMsg" style="margin-top: 15px; font-size: 14px;"></div>
            <div style="margin-top: 25px; padding-top: 15px; border-top: 1px dashed #d4b483;">
                <p style="font-size: 13px; color: #6b7280; margin-bottom: 10px;">ৰিপোৰ্ট পোৱাত কোনো অসুবিধা পাইছে নেকি? আমাৰ কাস্টমাৰ চাৰ্পোট সহায়কৰ সৈতে পোনপটীয়াকৈ কথা পাতক:</p>
                <button onclick="toggleSupportChat()" class="btn-action" style="background: linear-gradient(135deg, #10B981, #047857); padding: 10px 22px; font-size: 14px; border: none; cursor: pointer; border-radius: 25px;">🎧 কাস্টমাৰ চাৰ্পোট (Customer Support)</button>
            </div>
        `;
    }

    async function handleManualSearch() {
        const inputVal = (document.getElementById('lookupInput').value || '').trim();
        const msgDiv = document.getElementById('searchResultMsg');
        if (!inputVal) {
            msgDiv.innerHTML = "<span style='color:red;'>অনুগ্ৰহ কৰি আপোনাৰ ইমেইল বা অৰ্ডাৰ নম্বৰ দিয়ক।</span>";
            return;
        }

        msgDiv.innerHTML = "<span style='color:#8b0000;'>সন্ধান কৰি থকা হৈছে... ⏳</span>";

        const SUPABASE_URL = "https://ihbdrtnkfitytklonnel.supabase.co";
        const SUPABASE_KEY = "sb_publishable_aM1N898qE1gsw22dyxIoZQ_HTh_Qprj";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        try {
            let { data } = await sb.from('orders').select('*').or(`email.ilike.%${inputVal}%,public_order_id.eq.${inputVal},name.ilike.%${inputVal}%`).order('created_at', { ascending: false }).limit(1);
            if (data && data.length > 0) {
                const order = data[0];
                msgDiv.innerHTML = "<span style='color:green;'>অৰ্ডাৰ পোৱা গ'ল! ৰিপোৰ্ট প্ৰস্তুত কৰা হৈছে... ✨</span>";

                const dobStr = order.birth_date || '1996-01-01';
                const tobStr = order.birth_time || '10:30:00';
                const chart = buildFallbackVedicChart(dobStr, tobStr);
                const reportHtml = renderFullReport(order, chart);

                localStorage.setItem('ja_report_v8_' + order.id, reportHtml);
                localStorage.setItem('ja_report_' + order.id, reportHtml);
                localStorage.setItem('ja_latest_order_id', order.id);

                setTimeout(() => {
                    try {
                const sw = document.getElementById('support-widget-btn');
                if (sw) sw.remove();
                const sc = document.getElementById('support-chat-window');
                if (sc) sc.remove();
                const hd = document.querySelector('header');
                if (hd) hd.remove();
                const mn = document.querySelector('main');
                if (mn) mn.remove();
            } catch(e){}
            document.open();
            document.write(reportHtml);
            document.close();
                }, 800);
            } else {
                msgDiv.innerHTML = "<span style='color:red;'>এই ইমেইল বা অৰ্ডাৰ নম্বৰৰ কোনো অৰ্ডাৰ পোৱা নগ'ল। সহায়ৰ বাবে তলৰ '🎧 সহায় (Support)' বুটামত সমস্যা লিখক।</span>";
            }
        } catch(err) {
            msgDiv.innerHTML = "<span style='color:red;'>সন্ধান কৰোঁতে সমস্যা হৈছে: " + err.message + "</span>";
        }
    }

    function toggleSupportChat() {
        const chatWin = document.getElementById('support-chat-window');
        chatWin.style.display = (chatWin.style.display === 'flex') ? 'none' : 'flex';
    }

    async function sendSupportMessageToDB() {
        const name = document.getElementById('sup-name').value.trim();
        const contact = document.getElementById('sup-contact').value.trim();
        const msg = document.getElementById('sup-msg').value.trim();
        
        if (!name || !msg) {
            alert("অনুগ্ৰহ কৰি আপোনাৰ নাম আৰু সমস্যাটো লিখক!");
            return;
        }
