name: Auto Post Daily Rashifal to Facebook

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  post_to_facebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Assamese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra
          pip install playwright requests pytz
          playwright install chromium

      - name: Generate Rashifal Image & Post to Facebook
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python fb_autopost.py
