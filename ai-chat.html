<!DOCTYPE html>
<html lang="as">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI আচাৰ্য্যৰ সৈতে লাইভ চেট | জ্যোতিষ অসম</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Assamese:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Noto Sans Assamese', sans-serif; }
        body { background: #fdf5e6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: linear-gradient(135deg, #d4af37, #b48509); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 10; }
        .acharya-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; border: 2px solid #fff; }
        .name-status h2 { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
        .status { font-size: 12px; color: #fef08a; display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; display: inline-block; animation: blink 1.5s infinite; }
        
        .timer-box { background: rgba(0,0,0,0.2); padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.3); }
        .timer-warning { background: #ef4444; animation: pulse 1s infinite; border-color: #f87171; }
        .recharge-btn { background: #10B981; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        #chatArea { flex: 1; overflow-y: auto; padding: 20px; background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); display: flex; flex-direction: column; gap: 12px; }
        .message {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.6;
    position: relative;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    white-space: pre-wrap;
    word-break: break-word;
    display: flex;
    flex-direction: column;
}
        .msg-acharya { background: #fff; color: #333; align-self: flex-start; border-top-left-radius: 2px; border: 1px solid #d4af37; }
        .msg-user { background: linear-gradient(135deg, #d4af37, #b48509); color: white; align-self: flex-end; border-top-right-radius: 2px; }
        .msg-astro-name { font-size: 11px; color: #b48509; font-weight: bold; margin-bottom: 4px; }
        
        .typing-indicator { display: none; align-self: flex-start; background: #fff; padding: 10px 15px; border-radius: 16px; border-top-left-radius: 2px; font-size: 13px; color: #b48509; font-style: italic; border: 1px solid #d4af37; }
        .system-msg { align-self: center; background: rgba(212, 175, 55, 0.15); color: #b48509; font-size: 12px; font-weight: 600; padding: 6px 15px; border-radius: 20px; border: 1px solid rgba(212, 175, 55, 0.4); margin-bottom: 10px; }

        footer { background: #fff; padding: 15px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #e2e8f0; padding-bottom: 25px; }
        input[type="text"] { flex: 1; padding: 14px 20px; border-radius: 25px; border: 1px solid #cbd5e1; outline: none; font-size: 15px; background: #f8fafc; transition: 0.3s; }
        input[type="text"]:focus { border-color: #d4af37; background: #fff; }
        button.send-btn { background: linear-gradient(135deg, #d4af37, #b48509); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4); }
        button.send-btn:disabled { background: #9ca3af; cursor: not-allowed; box-shadow: none; }

        #extensionModal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: white; padding: 25px; border-radius: 16px; text-align: center; max-width: 400px; width: 100%; border-top: 5px solid #ef4444; }
        .pack-btn { display: flex; justify-content: space-between; align-items: center; padding: 15px; margin-bottom: 12px; border: 2px solid #e5e7eb; border-radius: 12px; cursor: pointer; background: #f9fafb; transition: 0.3s; }
        .pack-btn:hover { border-color: #d4af37; background: #fdf5e6; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <header>
        <div class="acharya-info">
            <div class="avatar">🛕</div>
            <div class="name-status">
                <h2>AI আচাৰ্য্যৰ সৈতে লাইভ চেট</h2>
                <div class="status" id="acharyaStatus"><span class="status-dot"></span> অনলাইন (Online)</div>
            </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <div class="timer-box" id="timerBox">⏱️ <span id="timeDisplay">00:00</span></div>
            <button class="recharge-btn" onclick="document.getElementById('extensionModal').style.display='flex'">+ ৰিচাৰ্জ</button>
        </div>
    </header>
    <div id="chartBadgeBar" style="background: #fff8e7; border-bottom: 2px solid #d4af37; padding: 10px 18px; font-size: 13.5px; color: #8b0000; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
        <div>🔮 <strong>সংযুক্ত কুণ্ডলী:</strong> <span id="chartSummaryText" style="color: #3e2723; font-weight: 600;">গণনা চলি আছে...</span></div>
        <div id="chartDashaBadge" style="background: #8b0000; color: #fef08a; padding: 3px 10px; border-radius: 12px; font-size: 11.5px; font-weight: bold;">মহাদশা: গণনা চলি আছে...</div>
    </div>

    <div id="chatArea">
        <div class="typing-indicator" id="typingIndicator">AI আচাৰ্য্যই টাইপ কৰি আছে... ⏳</div>
    </div>

    <footer>
        <input type="text" id="userInput" placeholder="আপোনাৰ প্ৰশ্ন ইয়াত লিখক..." onkeypress="if(event.key==='Enter') sendAIMessage()">
        <button class="send-btn" id="sendBtn" onclick="sendAIMessage()">➤</button>
    </footer>

    <div id="extensionModal">
        <div class="modal-card">
            <h3 style="color: #8b0000; font-size: 22px; margin-bottom: 10px;">⏳ সময় শেষ হৈছে!</h3>
            <p style="color: #4b5563; font-size: 14.5px; margin-bottom: 20px;">AI আচাৰ্য্যৰ সৈতে কথা-বতৰা অব্যাহত ৰাখিবলৈ সময় বৃদ্ধি কৰক।</p>
            <div class="pack-btn" onclick="rechargeTime(49, 5)">
                <span style="font-size: 18px; font-weight: 700;">+ ৫ মিনিট</span>
                <span style="font-size: 18px; font-weight: 700; color: #b48509;">₹49</span>
            </div>
            <div class="pack-btn" onclick="rechargeTime(79, 10)" style="border-color: #fbbf24; background: #fffbeb;">
                <span style="font-size: 18px; font-weight: 700;">+ ১০ মিনিট <span style="font-size:11px; background:#ef4444; color:white; padding:2px 6px; border-radius:10px;">POPULAR</span></span>
                <span style="font-size: 18px; font-weight: 700; color: #b48509;">₹79</span>
            </div>
            <button onclick="document.getElementById('extensionModal').style.display='none'" style="margin-top: 15px; background: none; border: none; color: #6b7280; text-decoration: underline; cursor: pointer;">পিছত কৰিম</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ihbdrtnkfitytklonnel.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_aM1N898qE1gsw22dyxIoZQ_HTh_Qprj";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // গ্ৰাহকৰ Profile ID টো LocalStorage ৰ পৰা লোৱা হৈছে
        const urlParams = new URLSearchParams(window.location.search);
        const profileId = urlParams.get('profile_id') || localStorage.getItem('ja_profile_id');
        if (profileId) {
            try { localStorage.setItem('ja_profile_id', profileId); } catch(e){}
        }
        let timerInterval;
        let availableSeconds = 0;

        
        let chartData = null;

        function buildFallbackVedicChart(dobStr, tobStr) {
            const rashis = ["Aries", "Taurus", "Gemini", "Cancer", "Leo", "Virgo", "Libra", "Scorpio", "Sagittarius", "Capricorn", "Aquarius", "Pisces"];
            const rashiAsMap = {
                "Aries": "মেষ", "Taurus": "বৃষ", "Gemini": "মিথুন", "Cancer": "কৰ্কট",
                "Leo": "সিংহ", "Virgo": "কন্যা", "Libra": "তুলা", "Scorpio": "বৃশ্চিক",
                "Sagittarius": "ধনু", "Capricorn": "মকৰ", "Aquarius": "কুম্ভ", "Pisces": "মীন"
            };
            const naks = ["অশ্বিনী", "ভৰণী", "কৃত্তিকা", "ৰোহিণী", "মৃগশিৰা", "আৰ্দ্বা", "পুনৰ্বসু", "পুষ্যা", "অশ্লেষা", "মঘা", "পূৰ্বফাল্গুনী", "উত্তৰফাল্গুনী", "হস্তা", "চিত্ৰা", "স্বাতী", "বিশাখা", "অনুৰাধা", "জ্যেষ্ঠা", "মূলা", "পূৰ্বাষাঢ়া", "উত্তৰাষাঢ়া", "শ্ৰৱণা", "ধনিষ্ঠা", "শতভিষা", "পূৰ্বভাদ্ৰপদ", "উত্তৰভাদ্ৰপদ", "ৰেৱতী"];
            
            const parts = String(dobStr || "1995-01-01").split(/[-/]/);
            const y = parseInt(parts[0], 10) || 1995;
            const m = parseInt(parts[1], 10) || 1;
            const d = parseInt(parts[2], 10) || 1;

            const tParts = String(tobStr || "12:00").split(":");
            const hr = parseInt(tParts[0], 10) || 12;
            const mn = parseInt(tParts[1], 10) || 0;

            let sunRashiIdx = ((m - 4 + 12) % 12);
            if (d < 14) sunRashiIdx = (sunRashiIdx + 11) % 12;

            const hoursSinceSunrise = ((hr + mn / 60) - 6 + 24) % 24;
            const ascIdx = (sunRashiIdx + Math.floor(hoursSinceSunrise / 2)) % 12;

            const jd = Math.floor(365.25 * y) + Math.floor(30.6001 * (m + 1)) + d + (hr / 24);
            const moonDeg = (((jd * 13.176396) % 360) + 360) % 360;
            const moonIdx = Math.floor(moonDeg / 30) % 12;
            const moonNak = naks[Math.floor(moonDeg / (360 / 27)) % 27];

            const seed = y + m * 31 + d;
            const makePlanet = (rIdx, offset) => ({
                rashi: rashis[rIdx % 12],
                rashi_as: rashiAsMap[rashis[rIdx % 12]],
                rashi_no: (rIdx % 12) + 1,
                nakshatra: naks[(rIdx * 2 + offset) % 27],
                pada: ((seed + offset) % 4) + 1
            });

            const planets = {
                Sun: makePlanet(sunRashiIdx, 1),
                Moon: { rashi: rashis[moonIdx], rashi_as: rashiAsMap[rashis[moonIdx]], rashi_no: moonIdx + 1, nakshatra: moonNak, pada: (d % 4) + 1 },
                Mars: makePlanet((sunRashiIdx + (seed % 7)) % 12, 2),
                Mercury: makePlanet((sunRashiIdx + (d % 2 === 0 ? 0 : 1)) % 12, 3),
                Jupiter: makePlanet((Math.floor((y - 1980) * 1.01) + 3) % 12, 4),
                Venus: makePlanet((sunRashiIdx + (m % 2 === 0 ? 0 : 11)) % 12, 5),
                Saturn: makePlanet(Math.floor(((y - 1980) * 0.4) + 5) % 12, 6),
                Rahu: makePlanet((12 - Math.floor(((y - 1980) * 0.65) % 12)) % 12, 7)
            };
            const ketuIdx = (planets.Rahu.rashi_no - 1 + 6) % 12;
            planets.Ketu = makePlanet(ketuIdx, 8);

            const houses = [];
            for (let i = 0; i < 12; i++) {
                const rName = rashis[(ascIdx + i) % 12];
                houses.push({ house: i + 1, rashi: rName, rashi_as: rashiAsMap[rName], rashi_no: ((ascIdx + i) % 12) + 1 });
            }

            const dashaLords = ["কেতু (Ketu)", "শুক্ৰ (Venus)", "সূৰ্য (Sun)", "চন্দ্ৰ (Moon)", "মংগল (Mars)", "ৰাহু (Rahu)", "বৃহস্পতি (Jupiter)", "শনি (Saturn)", "বুধ (Mercury)"];
            const dashaYears = [7, 20, 6, 10, 7, 18, 16, 19, 17];
            const startLordIdx = Math.floor(moonDeg / (360 / 27)) % 9;
            const dashas = [];
            let curYear = y;
            for (let i = 0; i < 8; i++) {
                const lIdx = (startLordIdx + i) % 9;
                const sDate = `${curYear}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                curYear += dashaYears[lIdx];
                const eDate = `${curYear}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                dashas.push({ lord: dashaLords[lIdx], start_date: sDate, end_date: eDate });
            }

            let activeDasha = "শুভ মহাদশা";
            const today = new Date();
            for(const d of dashas) {
                let s = new Date(d.start_date);
                let e = new Date(d.end_date);
                if(today >= s && today <= e) {
                    activeDasha = d.lord;
                    break;
                }
            }

            return { 
                ascendant: { rashi: rashis[ascIdx], rashi_as: rashiAsMap[rashis[ascIdx]], rashi_no: ascIdx + 1 }, 
                planets: planets, 
                houses: houses, 
                dashas: dashas,
                activeDasha: activeDasha
            };
        }

        async function initKundaliData() {
            try {
                const cached = sessionStorage.getItem('ja_chart_' + profileId) || localStorage.getItem('ja_chart_' + profileId);
                if (cached) {
                    chartData = JSON.parse(cached);
                }
            } catch(e){}

            if (!chartData && profileId) {
                try {
                    const { data: pData } = await supabaseClient.from('birth_profiles').select('*').eq('id', profileId).single();
                    if (pData) {
                        chartData = buildFallbackVedicChart(pData.birth_date, pData.birth_time);
                        try {
                            localStorage.setItem('ja_chart_' + profileId, JSON.stringify(chartData));
                            localStorage.setItem('ja_customer_name_' + profileId, pData.customer_name);
                        } catch(e){}
                    }
                } catch(e){}
            }

            if (chartData) {
                const ascName = chartData.ascendant.rashi_as || chartData.ascendant.rashi;
                const moonName = chartData.planets.Moon.rashi_as || chartData.planets.Moon.rashi;
                const nakName = chartData.planets.Moon.nakshatra || '';
                document.getElementById('chartSummaryText').innerText = `লগ্ন: ${ascName} | ৰাশি: ${moonName} (${nakName})`;
                document.getElementById('chartDashaBadge').innerText = `মহাদশা: ${chartData.activeDasha || 'চলমান'}`;
            } else {
                document.getElementById('chartSummaryText').innerText = "বৈদিক কুণ্ডলী সংযুক্ত";
                document.getElementById('chartDashaBadge').innerText = "অনলাইন";
            }
        }

        window.onload = async function() {
            if (!profileId) {
                alert("অনুগ্ৰহ কৰি প্ৰথমে পেমেন্ট সম্পূৰ্ণ কৰক।");
                window.location.href = "index.html";
                return;
            }
            await initKundaliData();
            await loadHistory();
            await checkSubscription();
        };

        // ১. ডাটাবেছৰ পৰা চেট হিষ্ট্ৰী লোড কৰা
        async function loadHistory() {
            const { data, error } = await supabaseClient
                .from('chat_messages')
                .select('*')
                .eq('profile_id', profileId)
                .order('created_at', { ascending: true });

            if (data && data.length > 0) {
                const chatArea = document.getElementById('chatArea');
                chatArea.innerHTML = '<div class="system-msg">✅ আপোনাৰ পূৰ্বৰ কথা-বতৰা</div>';
                
                data.forEach(msg => {
                    renderMessage(msg.sender_type, msg.message);
                });
                chatArea.innerHTML += `<div class="typing-indicator" id="typingIndicator">AI আচাৰ্য্যই টাইপ কৰি আছে... ⏳</div>`;
                chatArea.scrollTop = chatArea.scrollHeight;
            } else {
                let custName = localStorage.getItem('ja_customer_name_' + profileId) || "দেৱ";
                let greeting = chartData
                    ? `নমস্কাৰ ${custName}! মই জ্যোতিষ অসমৰ AI আচাৰ্য্য। আপোনাৰ জন্ম কুণ্ডলী (লগ্ন: ${chartData.ascendant.rashi_as || chartData.ascendant.rashi}, চন্দ্ৰ ৰাশি: ${chartData.planets.Moon.rashi_as || chartData.planets.Moon.rashi}, নক্ষত্ৰ: ${chartData.planets.Moon.nakshatra}) সফলতাৰে গণনা কৰা হৈছে। বৰ্তমান আপোনাৰ ${chartData.activeDasha || 'মহাদশা'} চলি আছে। কেৰিয়াৰ, বিবাহ, বা ব্যক্তিগত ভৱিষ্যত সম্পৰ্কে আপোনাৰ প্ৰধান প্ৰশ্নটো অনুগ্ৰহ কৰি তলত লিখক।`
                    : "নমস্কাৰ! মই জ্যোতিষ অসমৰ AI আচাৰ্য্যই কৈছোঁ। মই আপোনাৰ জন্ম কুণ্ডলীৰ সবিশেষ পৰ্যবেক্ষণ কৰি আছোঁ। আপোনাৰ প্ৰধান প্ৰশ্নটো কি, অনুগ্ৰহ কৰি তলত লিখক।";
                renderMessage("acharya", greeting);
            }
        }

        // ২. ডাটাবেছৰ পৰা সময় (Minutes) লোড কৰা
        async function checkSubscription() {
            const { data } = await supabaseClient
                .from('subscriptions')
                .select('available_minutes')
                .eq('profile_id', profileId)
                .single();

            if (data) {
                availableSeconds = data.available_minutes * 60;
                if (availableSeconds > 0) {
                    startTimer();
                } else {
                    lockChat();
                }
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            updateTimerUI();
            
            timerInterval = setInterval(async () => {
                availableSeconds--;
                updateTimerUI();

                // প্ৰতি ৬০ ছেকেণ্ডত ডাটাবেছত মিনিটটো আপডেট কৰা হ'ব
                if (availableSeconds > 0 && availableSeconds % 60 === 0) {
                    await supabaseClient.from('subscriptions')
                        .update({ available_minutes: availableSeconds / 60 })
                        .eq('profile_id', profileId);
                }

                if (availableSeconds <= 0) {
                    clearInterval(timerInterval);
                    await supabaseClient.from('subscriptions').update({ available_minutes: 0 }).eq('profile_id', profileId);
                    lockChat();
                    document.getElementById('extensionModal').style.display = 'flex';
                }
            }, 1000);
        }

        function updateTimerUI() {
            let m = Math.floor(availableSeconds / 60);
            let s = availableSeconds % 60;
            document.getElementById('timeDisplay').innerText = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);

            if (availableSeconds > 0 && availableSeconds <= 60) {
                document.getElementById('timerBox').classList.add('timer-warning'); 
            } else {
                document.getElementById('timerBox').classList.remove('timer-warning');
            }
        }

        function lockChat() {
            document.getElementById('userInput').disabled = true;
            document.getElementById('userInput').placeholder = "সময় শেষ! ➕ ৰিচাৰ্জ কৰি কথা পাতক...";
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('acharyaStatus').innerHTML = "অফলাইন - সময় উকলিছে";
            document.getElementById('acharyaStatus').style.color = "#fca5a5";
        }

        function unlockChat() {
            document.getElementById('userInput').disabled = false;
            document.getElementById('userInput').placeholder = "আপোনাৰ প্ৰশ্ন ইয়াত লিখক...";
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('acharyaStatus').innerHTML = "<span class='status-dot'></span> অনলাইন (Online)";
            document.getElementById('acharyaStatus').style.color = "#fef08a";
        }

       // ৩. AI লৈ মেছেজ পঠোৱা (Edge Function Call) - Fixed Version
        async function sendAIMessage() {
            if (availableSeconds <= 0) {
                document.getElementById('extensionModal').style.display = 'flex';
                return;
            }
            
            let inputField = document.getElementById('userInput');
            let text = inputField.value.trim();
            if(text === "") return;

            renderMessage("user", text);
            inputField.value = "";
            
            document.getElementById('typingIndicator').style.display = 'block';
            document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;

            try {
                const now = new Date();
                const currentDateStr = now.toISOString().split('T')[0];
                const currentYear = now.getFullYear();

                const response = await fetch(`${SUPABASE_URL}/functions/v1/ai-chat`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    },
                    body: JSON.stringify({ 
                        profileId: profileId, 
                        message: text,
                        currentYear: currentYear,
                        currentDate: currentDateStr,
                        chart: chartData,
                        clientAge: chartData ? chartData.clientAge : null,
                        isMinor: chartData ? chartData.isMinor : false,
                        lifeStage: chartData && chartData.isMinor ? (chartData.clientAge <= 1 ? "নৱজাতক শিশু (Newborn)" : (chartData.clientAge <= 12 ? "শিশু (Child)" : "কিশোৰ (Teenager)")) : "প্ৰাপ্তবয়স্ক (Adult)",
                        ascendant: chartData ? (chartData.ascendant.rashi_as || chartData.ascendant.rashi) : null,
                        moonRashi: chartData ? (chartData.planets.Moon.rashi_as || chartData.planets.Moon.rashi) : null,
                        nakshatra: chartData ? chartData.planets.Moon.nakshatra : null,
                        activeDasha: chartData ? chartData.activeDasha : null
                    })
                });
                
                const data = await response.json();
                document.getElementById('typingIndicator').style.display = 'none';

                // কেৱল আচলতে সময় শেষ হ'লেহে পপ-আপ দেখুৱাব
                if (data.error === 'time_up' || (data.success === false && data.error && data.error.includes('time'))) {
                    lockChat();
                    document.getElementById('extensionModal').style.display = 'flex';
                    return;
                }

                if (response.ok && data.success && data.reply) {
                    let cleanReply = data.reply
                        .replace(/আপোনাৰ কুণ্ডলীৰ বিশেষ বিশ্লেষণ[^\n]*?jyotishassam\.com\/premium/gi, '')
                        .replace(/https?:\/\/jyotishassam\.com\/[^\s\)\<]+/gi, '')
                        .replace(/আমাক প্ৰিমিয়াম সেৱা গ্ৰহণ কৰক[\s\S]*$/gi, '')
                        .trim();
                    renderMessage("acharya", cleanReply || data.reply);
                } else {
                    renderMessage("acharya", "ক্ষমা কৰিব, চাৰ্ভাৰত অলপ অসুবিধা হৈছে। পুনৰ সুধিবনে?");
                }
            } catch (error) {
                document.getElementById('typingIndicator').style.display = 'none';
                renderMessage("acharya", "ইণ্টাৰনেটৰ সংযোগ বিচ্ছিন্ন হৈছে। অনুগ্ৰহ কৰি পুনৰ চেষ্টা কৰক।");
            }
        }
        function renderMessage(sender, text) {
            let chatArea = document.getElementById('chatArea');
            let msgDiv = document.createElement('div');
            msgDiv.className = `message msg-${sender}`;
            
            if(sender === 'acharya') {
                msgDiv.innerHTML = `<div class="msg-astro-name">AI আচাৰ্য্য</div>${text}`;
            } else {
                msgDiv.innerHTML = `${text}`;
            }
            
            chatArea.insertBefore(msgDiv, document.getElementById('typingIndicator'));
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // ৪. ৰিচাৰ্জ পেমেন্ট
        
function ensureRazorpay() {
    if (typeof window.Razorpay === 'function') return Promise.resolve(window.Razorpay);
    return new Promise((resolve, reject) => {
        let attempts = 0;
        const checkExisting = setInterval(() => {
            if (typeof window.Razorpay === 'function') {
                clearInterval(checkExisting);
                return resolve(window.Razorpay);
            }
            attempts++;
            if (attempts >= 10) {
                clearInterval(checkExisting);
                let old = document.querySelector('script[src*="checkout.razorpay.com"]');
                if (old) old.remove();
                const s = document.createElement('script');
                s.src = 'https://checkout.razorpay.com/v1/checkout.js?retry=' + Date.now();
                s.async = true;
                s.onload = () => {
                    if (typeof window.Razorpay === 'function') resolve(window.Razorpay);
                    else reject(new Error('Razorpay SDK unavailable'));
                };
                s.onerror = () => reject(new Error('পেমেন্ট গেটৱে’ লোড কৰাত সমস্যা হৈছে।'));
                document.head.appendChild(s);
            }
        }, 100);
    });
}

async function rechargeTime(amount, minutesToAdd) {
            try {
                await ensureRazorpay();
                const serviceCode = minutesToAdd >= 10 ? 'chat_10m' : 'chat_5m';
                const custName = localStorage.getItem('ja_customer_name_' + profileId) || 'গ্ৰাহক';
                const apiBase = (window.JA_CONFIG && window.JA_CONFIG.apiBaseUrl) || (SUPABASE_URL + '/functions/v1');

                // ১. প্ৰথমে বেকএণ্ডত সুৰক্ষিতভাৱে Razorpay Order সৃষ্টি কৰক
                let rzpOrderId = null;
                let publicOrderId = null;
                let rzpKey = (window.JA_CONFIG && window.JA_CONFIG.razorpayKeyId) || "rzp_test_TjQLxMWOfOVhZq";
                try {
                    const createRes = await fetch(apiBase + '/create-order', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            service: serviceCode,
                            amount: amount,
                            name: custName,
                            email: 'chat@jyotishassam.com',
                            birthDate: '1995-01-01',
                            birthTime: '10:30:00',
                            birthPlace: 'অসম',
                            profileId: profileId,
                            minutesToAdd: minutesToAdd
                        })
                    });
                    if (createRes.ok) {
                        const cData = await createRes.json();
                        if (cData && cData.success) {
                            rzpOrderId = cData.razorpayOrderId;
                            publicOrderId = cData.orderId;
                            if (cData.keyId) rzpKey = cData.keyId;
                        }
                    }
                } catch (e) {
                    console.warn("Order creation fallback for chat recharge:", e);
                }

                var options = {
                    "key": rzpKey,
                    "amount": amount * 100,
                    "currency": "INR",
                    "name": "জ্যোতিষ অসম",
                    "description": `AI আচাৰ্য্যৰ সৈতে +${minutesToAdd} মিনিট`,
                    ...(rzpOrderId ? { "order_id": rzpOrderId } : {}),
                    "handler": async function (response) {
                        document.getElementById('extensionModal').style.display = 'none';
                        const currentMins = Math.floor(availableSeconds / 60);
                        const newMins = (currentMins > 0 ? currentMins : 0) + minutesToAdd;

                        // ২. বেকএণ্ডত পেমেণ্ট ছাইন ভেৰিফাই কৰি মিনিট যোগ কৰক
                        let backendUpdated = false;
                        try {
                            const verifyRes = await fetch(apiBase + '/verify-payment', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'apikey': SUPABASE_ANON_KEY,
                                    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                                },
                                body: JSON.stringify({
                                    orderId: publicOrderId,
                                    razorpay_order_id: response.razorpay_order_id || rzpOrderId,
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_signature: response.razorpay_signature,
                                    profileId: profileId,
                                    minutesToAdd: minutesToAdd
                                })
                            });
                            if (verifyRes.ok) {
                                const vData = await verifyRes.json();
                                if (vData && vData.success) backendUpdated = true;
                            }
                        } catch (vErr) {
                            console.warn("Verify payment warning:", vErr);
                        }

                        if (!backendUpdated) {
                            try {
                                await supabaseClient.from('subscriptions')
                                    .update({ available_minutes: newMins, payment_status: 'paid' })
                                    .eq('profile_id', profileId);
                            } catch (e) {}
                        }

                        availableSeconds = newMins * 60;
                        unlockChat();
                        startTimer();
                        renderMessage("acharya", `ধন্যবাদ! আপোনাৰ পেমেন্ট সফলতাৰে ভেৰিফাই হৈছে আৰু +${minutesToAdd} মিনিট সময় বৃদ্ধি কৰা হৈছে।`);
                    },
                    "theme": { "color": "#10B981" }
                };
                var rzp = new Razorpay(options);
                rzp.open();
            } catch (err) {
                alert("পেমেন্ট গেটৱে মুকলি কৰাত সমস্যা হৈছে: " + err.message);
            }
        }
    </script>
